title: 우아놀거리 - 전국 노래방·코인노래방·영화관·공연장 찾기
description: >-
  전국 노래방·코인노래방·영화관·공연장의 주소와 전화번호, 인허가 정보를 동네별로 확인하세요.
url: "https://wooaplay.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/
  - _rawdata/

# 설계 메모: 행안부 LOCALDATA 문화 시설업 인허가 CSV(영업/정상)를 가공한 _rawdata/pl_{시도}.json 으로
# 시도→시군구→동 허브 + 종류×(시도/시군구/동) 허브 + 시설 상세를 생성한다. 사이트맵은 pl_generator.rb 분할본.
