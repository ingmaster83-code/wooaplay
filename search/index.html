---
layout: default
title: 놀거리 시설 검색 - 동네·종류·시설명으로 찾기
description: 이름, 동네 이름, 종류(노래방·코인노래방·영화관)로 전국 놀거리 시설을 검색하세요. 예) 역삼동 노래방
---

<div class="section">
  <nav class="breadcrumb"><a href="/">홈</a> <span>›</span> <span>검색</span></nav>
  <h1 style="font-size:1.6rem;font-weight:800;margin:20px 0 24px;">🔍 놀거리 시설 검색</h1>

  <div class="search-wrap" style="max-width:100%;margin-bottom:24px;">
    <input type="text" id="searchInput" class="search-input"
           placeholder="예) 역삼동 노래방, 홍대 코인노래방, 영화관..."
           autocomplete="off" style="border:1px solid #E5E7EB;">
    <button class="search-btn" onclick="doSearch()">검색</button>
  </div>

  <p id="searchStatus" style="color:#6B7280;font-size:.87rem;margin-bottom:16px;">검색어를 입력하세요. 여러 단어는 공백으로 구분합니다.</p>
  <ul class="office-list" id="resultList"></ul>
</div>

<script>
let items = null;

(async () => {
  document.getElementById('searchStatus').textContent = '검색 인덱스를 불러오는 중...';
  const resp = await fetch('/search_index.json');
  items = await resp.json();
  items.forEach(f => { f.h = (f.n + ' ' + f.do + ' ' + f.sg + ' ' + f.dg + ' ' + f.c).toLowerCase(); });
  document.getElementById('searchStatus').textContent = `총 ${items.length.toLocaleString()}곳 검색 가능`;
  const q = new URLSearchParams(location.search).get('q');
  if (q) { document.getElementById('searchInput').value = q; doSearch(); }
})();

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q || !items) return;
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  const results = [];
  for (const f of items) {
    if (toks.every(t => f.h.includes(t))) { results.push(f); if (results.length >= 100) break; }
  }
  document.getElementById('searchStatus').textContent = `"${q}" 검색 결과: ${results.length}${results.length >= 100 ? '+' : ''}개`;
  const list = document.getElementById('resultList');
  if (results.length === 0) { list.innerHTML = '<li style="grid-column:1/-1;color:#6B7280;">검색 결과가 없습니다.</li>'; return; }
  list.innerHTML = results.map(f => `<li><a href="/place/${f.s}/"><b>${esc(f.n)}</b><small>${esc(f.c)} · ${esc(f.do)} ${esc(f.sg)} ${f.dg === '기타' ? '' : esc(f.dg)}</small></a></li>`).join('');
}

document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
